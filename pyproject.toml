[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysurveyor"
version = "0.1.0"
description = "Ordinary, weighted, and robust least squares adjustment of surveying control networks"
authors = [
    { name = "Michał Prędki" },
]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.4",
    "pandas>=3.0",
    "geopandas>=1.1",
    "scipy>=1.17",
]


[dependency-groups]
dev = [
    "black",
    "isort",
    "pre-commit",
    "pytest",
    "pytest-cov",
]


[project.urls]
Repository = "https://github.com/mpredki99/pysurv"


[tool.black]
line-length = 88
target-version = ["py312", "py313", "py314"]


[tool.isort]
profile = "black"
known_first_party = ["pysurveyor"]
src_paths = ["src"]
force_sort_within_sections = true
order_by_type = true


[tool.pytest.ini_options]
minversion = "9.0"
# -ra: show summary of all non-passing tests
# -p no:warnings: suppress warnings in output
addopts = "-ra -p no:warnings"
testpaths = ["tests"]


[tool.coverage.run]
branch = true
source = ["src/pysurveyor"]


[tool.coverage.report]
show_missing = true
precision = 2


[tool.coverage.html]
directory = "coverage-report"


[tool.hatch.build.targets.wheel]
packages = ["src/pysurveyor"]
