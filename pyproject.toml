[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysurv"
version = "0.1.0"
description = "Ordinary, weighted, and robust least squares adjustment of surveying control networks"
authors = [{name = "Michał Prędki"}]

readme = "README.md"
license = {text = "GPL-3.0"}

requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4",
    "pandas>=3.0",
    "geopandas>=1.1",
    "pydantic>=2.11",
    "scipy>=1.17"
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "pytest",
    "pytest-cov",
    "pre-commit"
]

[project.urls]
Repository = "https://github.com/mpredki99/pysurv"

[tool.black]
line-length = 88
target-version = ["py312", "py313", "py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["pysurv"]
src_paths = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
# -ra: show summary of all non-passing tests
# -q: quiet output
# -p no:warnings: suppress warnings in output
addopts = "-ra -q -p no:warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/pysurv"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 0
 
[tool.coverage.html]
directory = "coverage-report"
